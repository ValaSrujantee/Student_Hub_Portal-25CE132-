<!DOCTYPE html>
<html>
<head>
  <title>Student Hub Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <header>
    

  <div class="logo-container">
    <img src="https://tse1.mm.bing.net/th/id/OIP.qQQkshl4cY5SDDGWb7dROwAAAA?r=0&w=225&h=225&rs=1&pid=ImgDetMain&o=7&rm=3" alt="StudentHub Logo" class="logo">
    <h1 id="portalTitle">Student Hub</h1>
  </div>


</header>


  <main>
    <h2>Welcome</h2>
    <p>Please log in to continue.</p>
    <form onsubmit="return checkLogin()">
      <input type="text" id="role" placeholder="Enter role (student/faculty/admin)" required>
    </br>
    </br>
      <input type="password" id="password" placeholder="Enter password" required>
  </br>
  </br>
      <button type="submit">Login</button>
    </form>
  </main>

  <footer>
    <p>
      Email: <a href="mailto:studenthub123@gmail.com">studenthub123@gmail.com</a> |
      Mobile: <a href="tel:+919878564236">+91 9878564236</a>
    </p>
    <p>Address: 79, Raj Complex, near Iscon Temple, Ahmedabad, Gujarat, India</p>
  </footer>

  <script>
    function checkLogin() {
      let role = document.getElementById("role").value.toLowerCase().trim();
      let pass = document.getElementById("password").value.trim();

      if(role === "student" && pass === "123@123") {
        window.location.href = "portal.html?role=student";
        return false;
      }
      else if(role === "faculty" && pass === "1234@1234") {
        window.location.href = "portal.html?role=faculty";
        return false;
      }
      else if(role === "admin" && pass === "12345@12345") {
        window.location.href = "portal.html?role=admin";
        return false;
      }
      else {
        alert("Invalid credentials!");
        return false;
      }
    }
  </script>
</body>
</html>
